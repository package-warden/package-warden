server {
    listen 80;
    root /usr/share/nginx/html;

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # npm: tarball
    location = /test-package/-/test-package-1.0.0.tgz {
        alias /usr/share/nginx/html/tarball.tgz;
        default_type application/octet-stream;
    }

    # nuget: service index, nupkg
    location = /v3/index.json {
        alias /usr/share/nginx/html/nuget-v3-index.json;
        default_type application/json;
    }
    location = /v3-flatcontainer/test-package/1.0.0/test-package.1.0.0.nupkg {
        alias /usr/share/nginx/html/dummy.bin;
        default_type application/octet-stream;
    }

    # pypi: simple index, tarball
    location = /simple/test-package/ {
        try_files /pypi-simple-test-package.html =404;
        default_type text/html;
    }
    location = /packages/ab/test-package/test-package-1.0.0.tar.gz {
        alias /usr/share/nginx/html/dummy.bin;
        default_type application/octet-stream;
    }

    # maven: pom, jar
    location = /com/example/test-package/1.0.0/test-package-1.0.0.pom {
        alias /usr/share/nginx/html/maven-test-package-1.0.0.pom;
        default_type application/xml;
    }
    location = /com/example/test-package/1.0.0/test-package-1.0.0.jar {
        alias /usr/share/nginx/html/dummy.bin;
        default_type application/octet-stream;
    }

    # cargo: crate download
    location = /crates/test-package/1.0.0/download {
        alias /usr/share/nginx/html/dummy.bin;
        default_type application/octet-stream;
    }

    # gem: metadata json, gem file
    location = /api/v1/gems/test-gem.json {
        alias /usr/share/nginx/html/gem-test-gem.json;
        default_type application/json;
    }
    location = /gems/test-gem-1.0.0.gem {
        alias /usr/share/nginx/html/dummy.bin;
        default_type application/octet-stream;
    }

    # golang: version info, zip
    location = /golang.org/x/test/@v/v1.0.0.info {
        alias /usr/share/nginx/html/golang-v1.0.0.info;
        default_type application/json;
    }
    location = /golang.org/x/test/@v/v1.0.0.zip {
        alias /usr/share/nginx/html/dummy.bin;
        default_type application/zip;
    }

    location / {
        default_type application/json;
        try_files $uri $uri.json =404;
    }
}
